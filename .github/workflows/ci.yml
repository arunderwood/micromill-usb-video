name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    name: Build (MSVC x86)
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The build scripts take the Visual Studio root from %VS%; hosted runners
      # ship Enterprise, not the Community edition the scripts default to.
      - name: Locate Visual Studio
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio install with the MSVC x86/x64 toolchain' }
          Write-Host "Using $vs"
          "VS=$vs" >> $env:GITHUB_ENV

      - name: Build PXC200_Support.dll
        working-directory: src
        run: ./build.cmd

      - name: Verify PXC200_Support.dll
        run: .github/scripts/verify-dll.ps1 -Dll src/build/PXC200_Support.dll -Def src/pxcsupport.def

      # Reference-only tools still share src/ with the shipped DLL, so build
      # them to catch changes in src/ that break them.
      - name: Build pxc2_nt.dll capture shim
        working-directory: experimental
        run: ./build.cmd

      - name: Verify pxc2_nt.dll
        run: .github/scripts/verify-dll.ps1 -Dll experimental/build/pxc2_nt.dll -Def experimental/pxc2_nt.def

      - name: Build shim test harness
        working-directory: experimental/test
        run: ./build-test.cmd

      - name: Build capture probe
        working-directory: experimental/probe
        run: ./build-probe.cmd

      - name: Upload PXC200_Support.dll
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PXC200_Support-x86
          path: src/build/PXC200_Support.dll
          if-no-files-found: error
          retention-days: 30

  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.17.0
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" -R kjanat/actionlint -p "$archive" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$archive" -R kjanat/actionlint
          sudo tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/$archive" actionlint

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run 'zizmor==1.31.1' --format=github .
